<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Distressed Deals — DealFlow</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --line: #334155; --text: #e2e8f0; --muted: #94a3b8;
    --green: #22c55e; --green-bg: #14532d; --yellow: #facc15; --yellow-bg: #713f12;
    --gray-bg: #334155; --blue: #3b82f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg);
         color: var(--text); padding: 16px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
  a { color: inherit; }
  .wrap { max-width: 1200px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  header h1 { font-size: 22px; }
  .back { color: var(--muted); text-decoration: none; font-size: 14px; white-space: nowrap; }

  .search { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
            display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .search input { flex: 1 1 220px; min-width: 0; font-size: 17px; padding: 12px 14px; border-radius: 10px;
                  border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .search button { flex: 0 0 auto; font-size: 17px; font-weight: 600; padding: 12px 22px; border: 0;
                   border-radius: 10px; background: var(--blue); color: #fff; cursor: pointer; }
  .search button:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--muted); font-size: 13px; margin: 0 2px 18px; }
  .status { color: var(--muted); font-size: 14px; margin-bottom: 14px; display: flex; gap: 10px;
            align-items: center; flex-wrap: wrap; }
  .status a { color: #93c5fd; }
  .error { color: #fca5a5; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px;
          display: flex; flex-direction: column; gap: 12px; }
  .card.good { border-color: #166534; }
  .addr { font-size: 17px; font-weight: 600; line-height: 1.25; }
  .city { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 4px 8px; border-radius: 999px; }
  .tag.good { background: var(--green-bg); color: #86efac; }
  .tag.gray { background: var(--gray-bg); color: #cbd5e1; }
  .tag.low, .tag.offer { background: var(--yellow-bg); color: var(--yellow); }
  .tag.check { background: #7c2d12; color: #fdba74; }
  .card.offer { border-color: #854d0e; }
  .below.offer { color: var(--yellow); }

  details.unpriced { margin-top: 22px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  details.unpriced summary { cursor: pointer; padding: 14px 16px; font-weight: 600; color: var(--muted);
                             list-style: none; display: flex; justify-content: space-between; }
  details.unpriced summary::-webkit-details-marker { display: none; }
  details.unpriced summary::after { content: '▸'; }
  details.unpriced[open] summary::after { content: '▾'; }
  .urow { display: grid; grid-template-columns: minmax(0, 2fr) auto auto minmax(0, 2fr) auto; gap: 12px;
          align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 13px; }
  .urow .ua { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .urow .un { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .urow .ur { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .urow a { color: #93c5fd; white-space: nowrap; }
  .urow.done { grid-template-columns: minmax(0, 2fr) auto minmax(0, 1.5fr) auto auto; }
  .undo { color: #93c5fd; font-size: 13px; background: none; border: 0; padding: 0; cursor: pointer;
          text-decoration: underline; white-space: nowrap; }
  .tag.drop { background: #1e3a8a; color: #bfdbfe; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .pass { flex: 0 0 auto; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px;
          border: 1px solid var(--line); background: var(--bg); color: var(--muted); cursor: pointer; }
  .pass:hover { border-color: var(--muted); color: var(--text); }
  .confirm select { width: 100%; font-size: 17px; padding: 10px 12px; border-radius: 10px;
                    border: 1px solid var(--line); background: var(--bg); color: var(--text); }

  .prices { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .price { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .price.list { color: var(--muted); font-weight: 600; font-size: 20px; }
  .arrow { color: var(--muted); font-size: 20px; }
  .lbl { color: var(--muted); font-size: 12px; display: block; }
  .below { font-size: 15px; font-weight: 600; }
  .below.good { color: var(--green); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--bg); border-radius: 10px; padding: 8px; min-width: 0; }
  .stat b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; }
  .note { color: var(--muted); font-size: 13px; }
  .arvcalc { color: var(--muted); font-size: 12px; line-height: 1.35; }
  .arvcalc b { color: var(--text); font-weight: 600; }
  .stat.edit { cursor: pointer; border: 1px dashed transparent; }
  .stat.edit:hover { border-color: var(--line); }
  .stat.edited { border: 1px solid #1d4ed8; }
  .stat input { width: 100%; font-size: 15px; font-weight: 700; padding: 2px 4px; border-radius: 6px;
                border: 1px solid var(--blue); background: var(--panel); color: var(--text); }
  .pill.edited { background: #1e3a8a; color: #bfdbfe; margin-left: 0; }
  .reset { color: #93c5fd; font-size: 11px; margin-left: 4px; cursor: pointer; text-decoration: underline; background: none; border: 0; padding: 0; }
  .buttons .tracker { background: var(--blue); border-color: var(--blue); color: #fff; }
  .buttons .tracker.done { background: var(--green-bg); border-color: #166534; color: #86efac; cursor: default; }
  .buttons .tracker.exists { background: var(--gray-bg); border-color: var(--line); color: #cbd5e1; cursor: default; }
  .confirm label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  .confirm input { width: 100%; font-size: 22px; font-weight: 700; padding: 10px 12px; border-radius: 10px;
                   border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .confirm .rows { font-size: 14px; margin-top: 10px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
  .confirm .rows span:nth-child(odd) { color: var(--muted); }
  .confirm .acts { display: flex; gap: 10px; margin-top: 16px; }
  .confirm .acts button { flex: 1; padding: 12px; border-radius: 10px; border: 0; font-size: 15px; font-weight: 600; cursor: pointer; }
  .confirm .ok { background: var(--blue); color: #fff; }
  .confirm .no { background: var(--gray-bg); color: var(--text); }
  .confirm .err { color: #fca5a5; font-size: 13px; margin-top: 10px; }
  .buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
  .buttons a, .buttons button { flex: 1 1 0; min-width: 96px; text-align: center; font-size: 14px; font-weight: 600;
            padding: 11px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
            color: var(--text); text-decoration: none; cursor: pointer; }
  .buttons a:hover, .buttons button:hover { border-color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 40px 10px; }

  .sheet-bg { position: fixed; inset: 0; background: rgba(2, 6, 23, .7); display: none; align-items: center;
              justify-content: center; padding: 16px; z-index: 10; }
  .sheet-bg.open { display: flex; }
  .sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; width: 100%;
           max-width: 560px; max-height: 85vh; overflow: auto; padding: 18px; }
  .sheet h2 { font-size: 17px; margin-bottom: 2px; }
  .sheet .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; white-space: pre-line; }
  .comp { display: flex; justify-content: space-between; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); }
  .comp .a { font-size: 14px; font-weight: 600; }
  .comp .m { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .comp .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .comp .r b { font-size: 15px; }
  .pill { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 999px; margin-left: 4px; }
  .pill.REMODELED { background: var(--green-bg); color: #86efac; }
  .pill.UNKNOWN { background: var(--gray-bg); color: #cbd5e1; }
  .excl-h { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted);
            font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .comp.excluded .a, .comp.excluded .m, .comp.excluded .r { opacity: .6; }   /* text only: the checkbox stays live */
  .comp.excluded.picked .a, .comp.excluded.picked .m, .comp.excluded.picked .r { opacity: 1; }
  .warn { display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
          background: #7c2d12; color: #fdba74; }
  .comp .why { color: #fdba74; font-size: 12px; margin-top: 3px; }
  .comp .pick { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
  .comp input[type=checkbox] { width: 20px; height: 20px; margin-top: 1px; flex: 0 0 auto; accent-color: var(--blue); }
  .anchor { display: inline-block; white-space: nowrap; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line);
            background: var(--bg); color: #cbd5e1; cursor: pointer; margin-left: 4px; }
  .anchor.on { background: #713f12; border-color: #854d0e; color: var(--yellow); cursor: default; }
  .comp.picked { opacity: 1; }
  .pickmsg { color: #fdba74; font-size: 13px; min-height: 18px; margin: 4px 0 2px; }
  .close { width: 100%; margin-top: 14px; padding: 12px; border-radius: 10px; border: 0; background: var(--gray-bg);
           color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer; }

  @media (max-width: 600px) {
    body { padding: 12px; }
    header h1 { font-size: 19px; }
    .grid { grid-template-columns: 1fr; }
    .price { font-size: 24px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .urow { grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; }
    .urow .ur { grid-column: 1; white-space: normal; }
    .urow .un.dom { grid-column: 2; grid-row: 2; text-align: right; color: var(--muted); }
    .urow a { grid-column: 2; grid-row: 3; text-align: right; }
    .urow .un.uprice { grid-column: 2; grid-row: 1; text-align: right; }
    .urow.done { grid-template-columns: minmax(0, 1fr) auto auto; }
    .urow.done .ua { grid-column: 1; grid-row: 1; }
    .urow.done .un.uprice { grid-column: 2 / 4; grid-row: 1; }
    .urow.done .ur { grid-column: 1; grid-row: 2; }
    .urow.done a { grid-column: 2; grid-row: 2; }
    .urow.done .undo { grid-column: 3; grid-row: 2; text-align: right; }
    .sheet-bg { align-items: flex-end; padding: 0; }
    .sheet { border-radius: 16px 16px 0 0; max-height: 88vh;
             padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Distressed Deals</h1>
    <a class="back" href="/">← Dashboard</a>
  </header>

  <form class="search" id="search-form">
    <input id="zips" inputmode="numeric" autocomplete="off" placeholder="ZIP codes, e.g. 92703 92410" aria-label="ZIP codes">
    <button id="go" type="submit">Search</button>
  </form>
  <p class="hint">Up to 5 ZIPs. Takes a few minutes per ZIP (about $0.40 each). Read-only — nothing is submitted.</p>

  <div class="status" id="status"></div>
  <div class="grid" id="cards"></div>
  <div id="bottom">
    <div id="unpriced"></div>
    <div id="sent"></div>
    <div id="passed"></div>
  </div>
</div>

<div class="sheet-bg" id="pass-bg" onclick="if (event.target === this) closePass()">
  <div class="sheet confirm" role="dialog" aria-modal="true" aria-labelledby="pass-title">
    <h2 id="pass-title">Pass on this property</h2>
    <div class="sub" id="pass-sub"></div>
    <label for="pass-reason">Reason (optional)</label>
    <select id="pass-reason">
      <option value="">No reason</option>
      <option>Price too high</option>
      <option>Bad area</option>
      <option>Too much rehab</option>
      <option>Bad comps</option>
      <option>Other</option>
    </select>
    <div class="rows"><span></span><span class="note">It moves to “Passed”, and stays there in later searches unless the list price drops.</span></div>
    <div class="err" id="pass-err"></div>
    <div class="acts">
      <button class="no" type="button" onclick="closePass()">Cancel</button>
      <button class="ok" type="button" id="pass-ok" onclick="confirmPass()">Pass</button>
    </div>
  </div>
</div>

<div class="sheet-bg" id="confirm-bg" onclick="if (event.target === this) closeConfirm()">
  <div class="sheet confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <h2 id="confirm-title">Add to Tracker</h2>
    <div class="sub" id="confirm-sub"></div>
    <label for="offer">Offer price</label>
    <input id="offer" type="number" inputmode="numeric" min="0" step="1000">
    <div class="rows" id="confirm-rows"></div>
    <div class="err" id="confirm-err"></div>
    <div class="acts">
      <button class="no" type="button" onclick="closeConfirm()">Cancel</button>
      <button class="ok" type="button" id="confirm-ok" onclick="confirmAdd()">Add to tracker</button>
    </div>
  </div>
</div>

<div class="sheet-bg" id="sheet-bg" onclick="if (event.target === this) closeComps()">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title"></h2>
    <div class="sub" id="sheet-sub"></div>
    <div class="pickmsg" id="pickmsg"></div>
    <div id="sheet-list"></div>
    <button class="close" onclick="closeComps()">Close</button>
  </div>
</div>

<script src="/static/flip_calculator.js"></script>
<script>FlipCalc.DEFAULTS.wholesale_fee = {{ wholesale_fee }};   // the server's WHOLESALE_FEE</script>
<script>
let searchId = null, cards = [], pollTimer = null, deepLinkDone = false;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = v => (typeof v === 'number' && isFinite(v)) ? '$' + Math.round(v).toLocaleString('en-US') : '—';
const short = v => (typeof v === 'number' && isFinite(v))
  ? (Math.abs(v) >= 1e6 ? '$' + (v / 1e6).toFixed(2) + 'M' : '$' + Math.round(v / 1000) + 'k') : '—';

// ── ARV / rehab edits: saved per search in this browser until a new search ──
let edits = {}, added = {};
const editsKey = () => `dd-edits-${searchId}`;
function loadEdits() {
  try { edits = JSON.parse(localStorage.getItem(editsKey()) || '{}') || {}; } catch (e) { edits = {}; }
}
function saveEdits() {
  try { localStorage.setItem(editsKey(), JSON.stringify(edits)); } catch (e) { /* private mode: edits last this visit */ }
}
function clearAllEdits() {
  try { Object.keys(localStorage).filter(k => k.startsWith('dd-edits-')).forEach(k => localStorage.removeItem(k)); } catch (e) {}
  edits = {};
}

// Short label for why the search left a comp out ("Excluded: public record only").
function excludedLabel(reason) {
  const r = String(reason || '');
  return 'Excluded: ' + (r.startsWith('Fixer') ? 'fixer'
    : /public record/i.test(r) ? 'public record only'
    : r.startsWith('Lot ') ? 'lot over 2× the subject'
    : /outlier/i.test(r) ? '$/sqft outlier' : 'not used in ARV');
}

// ── Comp picks: which comps go to the tracker (anchor first), max 3 ──
const allComps = c => [...c.comps, ...(c.excluded_comps || [])];
const compBy = (c, a) => allComps(c).find(x => x.address === a);
const defaultPick = c => c.tracker_comps || [];
const pickOf = c => (edits[c.address] || {}).picked || defaultPick(c);
const sameList = (a, b) => a.length === b.length && a.every((x, k) => x === b[k]);
const compsEdited = c => { const p = (edits[c.address] || {}).picked; return !!p && !sameList(p, defaultPick(c)); };
// O, P, Q order — anchor first, then the others closest first (as the server writes them).
function trackerOrder(c) {
  const [anchor, ...rest] = pickOf(c);
  if (!anchor) return [];
  return [anchor, ...rest.sort((x, y) => ((compBy(c, x) || {}).distance_mi || 0) - ((compBy(c, y) || {}).distance_mi || 0))];
}
function setPick(c, picked) {
  const e = { ...(edits[c.address] || {}) };
  if (sameList(picked, defaultPick(c))) delete e.picked; else e.picked = picked;
  if (Object.keys(e).length) edits[c.address] = e; else delete edits[c.address];
  saveEdits();
}

// Effective numbers for a card: the owner's edits, re-run through the flip calculator.
function view(c) {
  const e = edits[c.address] || {};
  const pickEdited = compsEdited(c);
  // ARV: a typed number wins; then the owner's checked comps through the same rule; then the search's.
  const pickCalc = (pickEdited && e.arv == null)
    ? FlipCalc.arvFromComps(c.sqft, pickOf(c).map(a => compBy(c, a)).filter(Boolean), pickOf(c)[0]) : null;
  const arv = e.arv ?? (pickCalc ? pickCalc.arv : c.arv);
  const rehab = e.rehab ?? c.rehab, fee = e.fee ?? FlipCalc.DEFAULTS.wholesale_fee;
  const edited = e.arv != null || e.rehab != null || e.fee != null || pickEdited;
  let mao = c.mao, profit = c.profit_at_mao;
  if (edited && c.mao != null && arv != null && rehab != null) {
    const r = FlipCalc.maxAllowableOffer(arv, rehab, fee); mao = r.mao; profit = r.profit;
  }
  const pct = (mao != null && c.list_price) ? (c.list_price - mao) / c.list_price : null;
  const lowConf = pickEdited ? pickOf(c).length < 3 : c.low_confidence;
  const check = (mao != null && arv && c.list_price && arv > 1.5 * c.list_price) ? 'ARV LOOKS TOO HIGH – CHECK COMPS'
              : (lowConf && mao != null) ? 'CHECK COMPS' : null;
  const deal = check || pct == null ? null : pct <= 0.15 ? 'good' : pct <= 0.30 ? 'offer' : 'long';
  return { arv, rehab, fee, mao, profit, pct, check, deal, arvEdited: e.arv != null, rehabEdited: e.rehab != null,
           feeEdited: e.fee != null, pickEdited, arvExplain: pickCalc ? pickCalc.explain : c.arv_explain };
}

function startEdit(i, field, el) {
  const c = cards[i], v = view(c);
  if (el.querySelector('input')) return;
  const b = el.querySelector('b');
  b.innerHTML = `<input type="number" inputmode="numeric" min="0" step="1000" value="${Math.round(v[field] || 0)}" aria-label="${field}">`;
  const input = b.querySelector('input');
  input.focus(); input.select();
  let done = false;
  const commit = keep => {
    if (done) return; done = true;
    const n = Math.round(Number(input.value));
    const original = field === 'fee' ? FlipCalc.DEFAULTS.wholesale_fee : c[field];
    if (keep && isFinite(n) && n >= 0 && n !== Math.round(original ?? -1)) {
      edits[c.address] = { ...(edits[c.address] || {}), [field]: n };
    } else if (keep && n === Math.round(original ?? -1) && edits[c.address]) {
      delete edits[c.address][field];
    }
    saveEdits(); rerenderCard(i);
  };
  input.addEventListener('keydown', ev => { if (ev.key === 'Enter') commit(true); if (ev.key === 'Escape') commit(false); });
  input.addEventListener('blur', () => commit(true));
}
function resetEdit(ev, i, field) {
  ev.stopPropagation();
  const c = cards[i];
  if (edits[c.address]) { delete edits[c.address][field]; if (!Object.keys(edits[c.address]).length) delete edits[c.address]; }
  saveEdits(); rerenderCard(i);
}
function rerenderCard(i) {
  const el = document.querySelector(`article[data-i="${i}"]`);
  if (el) el.outerHTML = cardHtml(cards[i], i);
}

function trackerButton(c, i) {
  if (added[c.address]) return `<button type="button" class="tracker done" disabled>✓ In tracker</button>`;
  if (c.tracker === 'tracker') return `<button type="button" class="tracker exists" disabled title="Row ${c.tracker_row}">Already in tracker</button>`;
  if (c.tracker === 'archive') return `<button type="button" class="tracker exists" disabled title="Archive row ${c.tracker_row}">Already in tracker (archive)</button>`;
  return `<button type="button" class="tracker" onclick="openConfirm(${i})">Add to Tracker</button>`;
}

function cardHtml(c, i) {
  const v = view(c);
  const tags = [];
  if (c.price_drop) tags.push(`<span class="tag drop">PRICE DROPPED ${money(c.price_drop)}</span>`);
  const DEAL = {good: ['good', 'GOOD DEAL'], offer: ['offer', 'MAKE AN OFFER'], long: ['gray', 'LONG SHOT']};
  if (v.check) tags.push(`<span class="tag check">${esc(v.check)}</span>`);
  else if (v.deal) tags.push(`<span class="tag ${DEAL[v.deal][0]}">${DEAL[v.deal][1]}</span>`);
  if (c.multi_family) tags.push('<span class="tag gray">MULTI-FAMILY – NOT COMPED</span>');
  if (c.low_confidence) tags.push('<span class="tag low">LOW CONFIDENCE</span>');
  c.comp_flags.forEach(f => tags.push(`<span class="tag low">${esc(f)}</span>`));
  const tone = v.deal === 'good' ? ' good' : v.deal === 'offer' ? ' offer' : '';
  const editable = (field, label, value, isEdited) => `
        <div class="stat edit${isEdited ? ' edited' : ''}" onclick="startEdit(${i}, '${field}', this)" title="Click to change">
          <span class="lbl">${label}${isEdited ? ` <span class="pill edited">edited</span><button class="reset" onclick="resetEdit(event, ${i}, '${field}')">reset</button>` : ''}</span>
          <b>${short(value)}</b>
        </div>`;
  const below = v.pct == null ? '' : v.pct >= 0 ? `${(v.pct * 100).toFixed(1)}% below list` : `${(-v.pct * 100).toFixed(1)}% above list`;
  return `
    <article class="card${tone}" data-i="${i}">
      <div class="head">
        <div>
          <div class="addr">${esc(c.street)}</div>
          <div class="city">${esc(c.city)}</div>
        </div>
        <button type="button" class="pass" onclick="openPass(${i})">Pass</button>
      </div>
      ${tags.length ? `<div class="tags">${tags.join('')}</div>` : ''}
      <div>
        <div class="prices">
          <div><span class="lbl">List</span><span class="price list">${money(c.list_price)}</span></div>
          <span class="arrow">→</span>
          <div><span class="lbl">Max offer${v.arvEdited || v.rehabEdited || v.feeEdited || v.pickEdited ? ' (updated)' : ''}</span><span class="price">${money(v.mao)}</span></div>
        </div>
        ${v.mao != null ? `<div class="below${tone}">${below}</div>` : '<div class="below">No offer reaches 10% profit at these numbers</div>'}
      </div>
      <div class="stats">
        ${editable('arv', 'ARV', v.arv, v.arvEdited)}
        ${editable('rehab', 'Rehab' + (c.rehab_tier ? ' · ' + esc(c.rehab_tier) : ''), v.rehab, v.rehabEdited)}
        ${v.mao != null || v.feeEdited ? editable('fee', 'Wholesale fee', v.fee, v.feeEdited) : ''}
        <div class="stat"><span class="lbl">Profit @ max</span><b>${short(v.profit)}</b></div>
        <div class="stat"><span class="lbl">On market</span><b>${c.days_on_market ?? '—'} d</b></div>
      </div>
      ${v.arvExplain ? `<div class="arvcalc">${v.pickEdited ? '<span class="pill edited">comps edited</span><button class="reset" onclick="resetPick(' + i + ')">reset</button> ' : ''}ARV: ${esc(v.arvExplain)}${v.arvEdited ? ` · <b>you set ${money(v.arv)}</b>` : ''}</div>` : ''}
      <div class="buttons">
        ${c.zillow_url ? `<a href="${esc(c.zillow_url)}" target="_blank" rel="noopener">View on Zillow</a>` : ''}
        <button type="button" onclick="openComps(${i})" ${c.comps.length || (c.excluded_comps || []).length ? '' : 'disabled'}>See comps (${c.comps.length})</button>
        ${v.mao != null ? trackerButton(c, i) : ''}
      </div>
    </article>`;
}

// One line in "Sent to tracker" / "Passed", with Undo back to the main list.
function decidedRow(c, i) {
  const why = c.decision === 'passed' ? (c.pass_reason || 'No reason')
            : c.tracker_row ? `Row ${c.tracker_row}${c.tracker === 'archive' ? ' (archive)' : ''}` : 'In tracker';
  return `
    <div class="urow done">
      <div class="ua" title="${esc(c.address)}">${esc(c.street)}<span class="ur">, ${esc(c.city)}</span></div>
      <div class="un uprice">${money(c.list_price)}</div>
      <div class="ur">${esc(why)}</div>
      ${c.zillow_url ? `<a href="${esc(c.zillow_url)}" target="_blank" rel="noopener">Zillow ↗</a>` : '<span></span>'}
      <button type="button" class="undo" onclick="undoDecision(${i})">Undo</button>
    </div>`;
}

function unpricedRow(c, i) {
  return `
    <div class="urow">
      <div class="ua" title="${esc(c.address)}">${esc(c.street)}<span class="ur">, ${esc(c.city)}</span></div>
      <div class="un uprice">${money(c.list_price)}</div>
      <div class="un dom">${c.days_on_market ?? '—'} d</div>
      <div class="ur" title="${esc(c.unpriced_reason)}">${esc(c.unpriced_reason)}</div>
      ${c.zillow_url ? `<a href="${esc(c.zillow_url)}" target="_blank" rel="noopener">Zillow ↗</a>` : '<span></span>'}
      <button type="button" class="undo" onclick="openPass(${i})">Pass</button>
    </div>`;
}

let running = false;
function render(data) {
  cards = data.cards || [];
  loadEdits();
  running = data.status === 'running';
  const done = data.zips_done, total = data.zips.length;
  let status = running
    ? `Searching ${data.zips.join(', ')} — ${done} of ${total} ZIP${total > 1 ? 's' : ''} done. This takes a few minutes per ZIP.`
    : data.status === 'failed'
      ? `<span class="error">Search stopped: ${esc(data.error || 'unknown error')}</span>`
      : `${cards.length} distressed propert${cards.length === 1 ? 'y' : 'ies'} in ${data.zips.join(', ')}.`;
  Object.entries(data.zip_errors || {}).forEach(([z, e]) => status += ` <span class="error">${z}: ${esc(e)}</span>`);
  if (data.tracker_error) status += ` <span class="error">${esc(data.tracker_error)}</span>`;
  if (!running && cards.length) status += ` <a href="/api/distressed/search/${data.id}/csv">Download all (CSV)</a>`;
  $('status').innerHTML = status;
  $('go').disabled = running;
  renderLists();
  if (!deepLinkDone && cards.length) {          // #comps=N opens that card's comps (shareable link)
    const m = location.hash.match(/comps=(\d+)/);
    if (m && cards[+m[1]]) { openComps(+m[1]); deepLinkDone = true; }
  }
}

// Main list = properties not decided on yet. Priced ones as big cards (indices
// into `cards` keep "See comps" working); the ones with no max offer, and the
// sent / passed ones, collapse into one-line rows at the bottom.
function renderLists() {
  const all = cards.map((c, i) => [c, i]);
  const open = all.filter(([c]) => !c.decision);
  const priced = open.filter(([c]) => c.mao != null), unpriced = open.filter(([c]) => c.mao == null);
  const sent = all.filter(([c]) => c.decision === 'sent'), passed = all.filter(([c]) => c.decision === 'passed');
  $('cards').innerHTML = priced.length ? priced.map(([c, i]) => cardHtml(c, i)).join('')
    : running ? '' : `<div class="empty">${cards.length ? 'Nothing new to decide on.' : 'No distressed listings found.'}</div>`;
  const section = (el, title, list, rowFn) => {
    const wasOpen = !!$(el).querySelector('details[open]');
    $(el).innerHTML = list.length ? `
    <details class="unpriced"${wasOpen ? ' open' : ''}>
      <summary>${title} (${list.length})</summary>
      ${list.map(([c, i]) => rowFn(c, i)).join('')}
    </details>` : '';
  };
  section('unpriced', 'Couldn’t price', unpriced, unpricedRow);
  section('sent', 'Sent to tracker', sent, decidedRow);
  section('passed', 'Passed', passed, decidedRow);
}

async function postDecision(c, action, reason) {
  const r = await fetch('/api/distressed/decision', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({search_id: searchId, zip: c.zip, address: c.address, action, reason: reason || null})
  });
  if (r.status === 401) { location.href = '/login'; return false; }
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'Could not save');
  return true;
}

let passIdx = null;
function openPass(i) {
  passIdx = i;
  $('pass-sub').textContent = cards[i].address;
  $('pass-reason').value = '';
  $('pass-err').textContent = '';
  $('pass-ok').disabled = false;
  $('pass-bg').classList.add('open');
}
function closePass() { $('pass-bg').classList.remove('open'); passIdx = null; }
async function confirmPass() {
  const c = cards[passIdx], reason = $('pass-reason').value;
  $('pass-ok').disabled = true;
  try {
    if (!await postDecision(c, 'pass', reason)) return;
    Object.assign(c, {decision: 'passed', pass_reason: reason || null, price_drop: null});
    closePass(); renderLists();
  } catch (e) {
    $('pass-err').textContent = e.message;
    $('pass-ok').disabled = false;
  }
}
async function undoDecision(i) {
  const c = cards[i];
  try {
    if (!await postDecision(c, 'undo')) return;
    c.decision = null; c.price_drop = null;
    renderLists();
  } catch (e) { alert(e.message); }
}

async function poll() {
  clearTimeout(pollTimer);
  if (searchId == null) return;
  try {
    const r = await fetch('/api/distressed/search/' + searchId);
    if (r.status === 401) { location.href = '/login'; return; }
    const data = await r.json();
    if (data.error && !data.status) throw new Error(data.error);
    render(data);
    if (data.status === 'running') pollTimer = setTimeout(poll, 5000);
  } catch (e) {
    $('status').innerHTML = `<span class="error">Couldn’t load results: ${esc(e.message)}. Retrying…</span>`;
    pollTimer = setTimeout(poll, 10000);
  }
}

$('search-form').addEventListener('submit', async ev => {
  ev.preventDefault();
  $('go').disabled = true;
  try {
    const r = await fetch('/api/distressed/search', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({zips: $('zips').value})
    });
    const data = await r.json();
    if (!r.ok && !data.id) throw new Error(data.error || 'Search failed');
    if (r.status === 409) $('status').textContent = 'A search is already running — showing it.';
    if (data.id !== searchId) clearAllEdits();          // a new search starts with no edits
    searchId = data.id; added = {};
    $('cards').innerHTML = '';
    poll();
  } catch (e) {
    $('status').innerHTML = `<span class="error">${esc(e.message)}</span>`;
    $('go').disabled = false;
  }
});

let compsIdx = null;
function openComps(i) { compsIdx = i; $('pickmsg').textContent = ''; renderComps(); $('sheet-bg').classList.add('open'); }

function renderComps() {
  const i = compsIdx, c = cards[i], v = view(c), picked = pickOf(c);
  const ex = c.excluded_comps || [];
  $('sheet-title').textContent = c.street;
  $('sheet-sub').innerHTML = `ARV ${money(v.arv)} · ${esc(v.arvExplain || '')}`
    + `<br>Tick up to 3 comps for the tracker; ★ = Anchor Comp (column O).`
    + (v.pickEdited ? ` <span class="pill edited">comps edited</span><button class="reset" onclick="resetPick(${i})">reset</button>` : '');
  const row = (x, isExcluded) => {
    const on = picked.includes(x.address), anchor = picked[0] === x.address;
    const why = isExcluded ? `<span class="warn">${esc(excludedLabel(x.reason))}</span><div class="why">${esc(x.reason)}</div>`
              : (x.in_arv === false ? '<div class="why">Not in ARV — only the best 3 comps are averaged</div>' : '');
    return `
    <div class="comp${isExcluded ? ' excluded' : ''}${on ? ' picked' : ''}">
      <label class="pick">
        <input type="checkbox" ${on ? 'checked' : ''} onchange="togglePick(${JSON.stringify(x.address).replace(/"/g, '&quot;')}, this)">
        <div>
          <div class="a">${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(String(x.address).split(',')[0])}</a>` : esc(x.address)}
            ${isExcluded ? '' : `<span class="pill ${esc(x.remodeled)}">${x.remodeled === 'REMODELED' ? 'REMODELED' : 'UNKNOWN'}</span>`}
            ${on ? (anchor ? '<span class="anchor on">★ Anchor</span>'
                           : `<button type="button" class="anchor" onclick="event.preventDefault(); makeAnchor(${JSON.stringify(x.address).replace(/"/g, '&quot;')})">Make anchor</button>`) : ''}</div>
          <div class="m">Sold ${esc(x.sold_date)} · ${Math.round(x.sqft).toLocaleString('en-US')} sqft · ${(+x.distance_mi).toFixed(2)} mi</div>
          ${why}
        </div>
      </label>
      <div class="r"><b>${money(x.sold_price)}</b><div class="m">${money(x.price_per_sqft)}/sqft</div></div>
    </div>`;
  };
  $('sheet-list').innerHTML = c.comps.map(x => row(x, false)).join('')
    + (ex.length ? '<div class="excl-h">Not used in ARV</div>' + ex.map(x => row(x, true)).join('') : '');
}

function togglePick(address, box) {
  const c = cards[compsIdx];
  let picked = [...pickOf(c)];
  if (box.checked) {
    if (picked.length >= 3) { box.checked = false; $('pickmsg').textContent = 'Max 3 comps.'; return; }
    picked.push(address);
  } else {
    picked = picked.filter(a => a !== address);       // unticking the anchor makes the next one the anchor
  }
  $('pickmsg').textContent = '';
  setPick(c, picked); renderComps(); rerenderCard(compsIdx);
}
function makeAnchor(address) {
  const c = cards[compsIdx];
  setPick(c, [address, ...pickOf(c).filter(a => a !== address)]); renderComps(); rerenderCard(compsIdx);
}
function resetPick(i) {
  const c = cards[i];
  setPick(c, defaultPick(c));
  if (compsIdx === i && $('sheet-bg').classList.contains('open')) renderComps();
  rerenderCard(i);
}
function closeComps() { $('sheet-bg').classList.remove('open'); }

let confirmIdx = null;
function openConfirm(i) {
  confirmIdx = i;
  const c = cards[i], v = view(c);
  $('confirm-sub').textContent = c.address;
  $('offer').value = v.mao != null ? Math.round(v.mao) : '';
  $('confirm-rows').innerHTML = `
    <span>Max offer</span><span>${money(v.mao)}${v.arvEdited || v.rehabEdited || v.feeEdited || v.pickEdited ? ' (updated)' : ''}</span>
    <span>ARV</span><span>${money(v.arv)}${v.arvEdited ? ` (edited from ${money(c.arv)})` : v.pickEdited ? ' (from your comps)' : ''}</span>
    <span>Rehab</span><span>${money(v.rehab)}${v.rehabEdited ? ` (edited from ${money(c.rehab)})` : ''}</span>
    <span>Wholesale fee</span><span>${money(v.fee)}${v.feeEdited ? ` (edited from ${money(FlipCalc.DEFAULTS.wholesale_fee)})` : ''}</span>
    <span>Comps${v.pickEdited ? ' (edited)' : ''}</span><span>${trackerOrder(c).map((a, k) => {
      const x = compBy(c, a), ex = (c.excluded_comps || []).includes(x);
      return (k === 0 ? '★ ' : '') + esc(String(a).split(',')[0]) + (ex ? ` <span class="warn">${esc(excludedLabel(x.reason))}</span>` : '');
    }).join('<br>') || '—'}</span>`;
  $('confirm-err').textContent = '';
  $('confirm-ok').disabled = false;
  $('confirm-bg').classList.add('open');
  setTimeout(() => $('offer').select(), 50);
}
function closeConfirm() { $('confirm-bg').classList.remove('open'); confirmIdx = null; }

async function confirmAdd() {
  const i = confirmIdx, c = cards[i], v = view(c);
  const offer = Math.round(Number($('offer').value));
  if (!isFinite(offer) || offer <= 0) { $('confirm-err').textContent = 'Enter an offer price.'; return; }
  $('confirm-ok').disabled = true;
  try {
    const r = await fetch('/api/distressed/tracker', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({search_id: searchId, zip: c.zip, address: c.address, offer,
                            arv: v.arvEdited ? v.arv : null, rehab: v.rehabEdited ? v.rehab : null,
                            fee: v.feeEdited ? v.fee : null,
                            comps: v.pickEdited ? pickOf(c) : null})
    });
    if (r.status === 401) { location.href = '/login'; return; }
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Could not add');
    if (d.status === 'added') { added[c.address] = d.row; c.tracker = 'tracker'; }
    else c.tracker = d.where;
    c.tracker_row = d.row; c.decision = 'sent'; c.price_drop = null;     // moves to "Sent to tracker"
    closeConfirm(); renderLists();
  } catch (e) {
    $('confirm-err').textContent = e.message;
    $('confirm-ok').disabled = false;
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeComps(); closeConfirm(); closePass(); } });

(async () => {                                   // reopen the latest search on load
  try {
    const r = await fetch('/api/distressed/search/latest');
    if (r.status === 401) { location.href = '/login'; return; }
    const { id } = await r.json();
    if (id != null) { searchId = id; poll(); }
  } catch (e) { /* first visit: nothing to show */ }
})();
</script>
</body>
</html>
